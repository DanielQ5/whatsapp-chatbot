spring.application.name=whatsapp-chatbot

# Server Configuration
server.port=8080
# Trust X-Forwarded-* headers from the ngrok tunnel / reverse proxy so
# HttpServletRequest.getRequestURL() reflects the public HTTPS URL Twilio
# actually signed, not the internal http://localhost scheme.
server.forward-headers-strategy=framework

# Twilio webhook signature validation
twilio.auth.token=${TWILIO_AUTH_TOKEN}

# Production Database (READ ONLY - Policies)
spring.datasource.production.jdbc-url=jdbc:postgresql://localhost:5432/insurance_production
spring.datasource.production.username=postgres
spring.datasource.production.password=${PROD_DB_PASSWORD}
spring.datasource.production.driver-class-name=org.postgresql.Driver

# Bot Database (READ/WRITE - Analytics)
spring.datasource.chatanalytics.jdbc-url=jdbc:postgresql://localhost:5432/insurance_chatanalytics
spring.datasource.chatanalytics.username=postgres
spring.datasource.chatanalytics.password=${ANALYTICS_DB_PASSWORD}
spring.datasource.chatanalytics.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disabled by default: logs full SQL (against PII-bearing entities like Policy)
# to application logs. Override locally (e.g. -Dspring.jpa.show-sql=true) if needed.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.chatbot=DEBUG

weather.api.key=${WEATHER_API_KEY}

#GEMINI
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
